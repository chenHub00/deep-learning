name: Notebooks

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU PyTorch and dependencies
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Execute ported notebooks
        env:
          DL_SMOKE: "1"
        # Notebooks are added to ported_notebooks.txt as each one is migrated.
        run: |
          while read -r nb; do
            [ -z "$nb" ] && continue
            pytest --nbmake --nbmake-timeout=1800 "$nb"
          done < ported_notebooks.txt
      - name: Execute exercise notebooks with solutions filled in
        run: pytest tests
